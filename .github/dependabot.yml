version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "dependabot"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    versioning-strategy: "auto"
    groups:
      npm-dependencies:
        patterns:
          - "*"
